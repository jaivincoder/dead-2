<header class="sticky top-0 z-20 border-b border-border bg-white">
  <div
    class="mx-auto flex w-full max-w-screen-xl items-center justify-between gap-4 px-4 py-3 md:px-6 lg:px-8"
  >
    <a routerLink="/" class="text-lg font-semibold text-primary-deep">{{ appName }}</a>
    <nav class="hidden items-center gap-6 md:flex" aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="text-primary-deep"
        [routerLinkActiveOptions]="{ exact: true, queryParams: 'ignored' }"
        ariaCurrentWhenActive="page"
        class="text-sm font-semibold text-muted"
      >
        Home
      </a>
      <a
        routerLink="/account"
        routerLinkActive="text-primary-deep"
        ariaCurrentWhenActive="page"
        class="text-sm font-semibold text-muted"
      >
        Account
      </a>
    </nav>
    <button
      type="button"
      class="rounded-lg px-3 py-2 text-sm font-semibold text-primary-deep focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-deep md:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? 'Close' : 'Menu' }}
    </button>
  </div>
  @if (menuOpen()) {
    <nav id="mobile-nav" class="border-t border-border px-4 py-3 md:hidden" aria-label="Primary">
      <div class="flex flex-col gap-3">
        <a routerLink="/" class="text-sm font-semibold text-muted">Home</a>
        <a routerLink="/account" class="text-sm font-semibold text-muted">Account</a>
      </div>
    </nav>
  }
</header>
