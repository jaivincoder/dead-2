<footer class="border-t border-border bg-white">
  <div
    class="mx-auto flex w-full max-w-screen-xl flex-col gap-2 px-4 py-6 text-sm text-muted md:flex-row md:items-center md:justify-between md:px-6 lg:px-8"
  >
    <p>{{ appName }}</p>
    <div class="flex items-center gap-4">
      @if (email) {
        <a class="font-semibold text-primary-deep" [href]="'mailto:' + email">{{ email }}</a>
      }
      <p>{{ year }}</p>
    </div>
  </div>
</footer>
