<div
  class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4"
  aria-live="polite"
>
  @for (toast of toasts.list(); track toast.id) {
    <div
      role="status"
      class="pointer-events-auto flex w-full max-w-sm items-start justify-between gap-3 rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-soft"
      [class.bg-danger]="toast.kind === 'error'"
      [class.bg-success]="toast.kind === 'success'"
      [class.bg-primary-deep]="toast.kind === 'info'"
    >
      <p>{{ toast.text }}</p>
      <button type="button" class="shrink-0 text-white/80" (click)="toasts.dismiss(toast.id)">
        Dismiss
      </button>
    </div>
  }
</div>
