<input
  [id]="inputId() ?? null"
  [class]="fieldClass()"
  [type]="type()"
  [name]="name()"
  [value]="value()"
  [disabled]="inactive()"
  [placeholder]="placeholder()"
  [attr.autocomplete]="autocomplete() ?? null"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="describedBy() ?? null"
  [attr.min]="min()"
  [attr.max]="max()"
  [attr.step]="step()"
  [attr.maxlength]="maxlength()"
  (input)="onInput($event)"
  (blur)="touch()"
  (keydown)="blockInvalidKeys($event)"
/>
